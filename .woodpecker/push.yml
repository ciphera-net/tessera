# Builds and publishes the tessera-sidecar image.
#
# WHY THIS FILE EXISTS (12-08-2026)
#   The sidecar image was the only container in the estate with no pipeline: it
#   was built and pushed by hand. So the image running in production drifted from
#   this repo with nothing to detect it, and shipping any change to the OPAQUE
#   server — including a security fix — depended on somebody remembering the
#   exact `docker build` invocation. An image that only a person can produce is
#   an image that stops matching its source.
#
#   It also blocked the id-backend replica increase: the sealed-login-state
#   change is inert until a new sidecar image is live, and there was no
#   supported way to produce one.
#
# ⚠️ REQUIRES TWO SECRETS THAT THIS REPO DOES NOT YET HAVE.
#   `registry_username` and `registry_password`, exactly as every other
#   image-publishing repo carries them (see ciphera-id, id-frontend, pulse-*).
#   Until they are added at ci.ciphera.net → tessera → Settings → Secrets, this
#   workflow fails at the push step. Nothing else is needed.
#
# Routes to the in-cluster Kubernetes agent, which advertises `!runner=k8s` — a
# MANDATORY label, so an agent is only eligible when the task asks for it. A
# workflow WITHOUT it is ineligible everywhere and queues PENDING FOREVER rather
# than failing.
labels:
  runner: k8s

# The image is not published unless the suite, clippy and rustfmt all pass.
depends_on:
  - test

when:
  - event: push
    branch: main

steps:
  push:
    image: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
    # 🔑 Down from 3Gi request == 3Gi limit under kaniko — the compile moved into the shared daemon.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 256Mi, cpu: 200m }
          limits: { memory: 768Mi }
    # NOTE: `extra_hosts` is GONE and its absence is correct. The Exoscale NLB
    # hairpin pin for registry.ops.ciphera.net moved to the DAEMON (hostAliases in
    # buildkitd.yaml) because the DAEMON performs the push — buildctl only hands it
    # the image name and forwards credentials over the session. Verified 21-08-2026
    # from inside the daemon: GET https://registry.ops.ciphera.net/v2/ -> HTTP 401.
    environment:
      BUILDKIT_HOST: tcp://buildkitd.buildkit.svc.cluster.local:1234
      CACHE_ENDPOINT: https://sos-ch-dk-2.exo.io
      CACHE_BUCKET: ciphera-build-cache
      CACHE_REGION: ch-dk-2
      CACHE_NAME: tessera-sidecar
      REGISTRY: registry.ops.ciphera.net
      IMAGE_REPO: ciphera-net/tessera-sidecar
      IMAGE_TAG: sha-${CI_COMMIT_SHA:0:7}
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      # 🔴 SOVEREIGNTY TRIPWIRE — see build.yml for the full reasoning.
      - |
        case "$CACHE_ENDPOINT" in
          https://sos-*.exo.io) echo "cache endpoint OK: $CACHE_ENDPOINT" ;;
          *) echo "REFUSING: cache endpoint '$CACHE_ENDPOINT' is not Exoscale SOS"; exit 1 ;;
        esac
      # buildctl reads the client's docker config and forwards the credential to the
      # daemon PER BUILD over the session. That is what keeps the registry push
      # credential subject to Woodpecker's per-repo trust and event gating — the
      # daemon holds no standing registry credential of its own, deliberately (its
      # Vault policy refuses kv/shared/ci-registry for exactly this reason).
      # `base64 | tr -d` rather than `base64 -w0`: this is BusyBox base64.
      - |
        mkdir -p /root/.docker
        AUTH=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > /root/.docker/config.json
        chmod 600 /root/.docker/config.json
      # 🔑 A GREEN STEP PROVES THE CACHE WAS WRITTEN. A failed `--export-cache` is
      # FATAL, not a warning — `ignore-error` defaults to false and is not set.
      # Measured 21-08-2026 against a non-existent bucket: exit=1, "api error
      # NoSuchBucket". So there is no separate post-flight check: this step
      # succeeding IS the check, and the credential only works against SOS.
      #
      # The `name=` value carries a comma to publish two tags, so it must be QUOTED
      # INSIDE the CSV or buildctl reads `latest` as a separate attribute.
      - |
        buildctl build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --opt filename=Dockerfile \
          --import-cache "type=s3,region=$CACHE_REGION,bucket=$CACHE_BUCKET,endpoint_url=$CACHE_ENDPOINT,use_path_style=true,name=$CACHE_NAME" \
          --export-cache "type=s3,region=$CACHE_REGION,bucket=$CACHE_BUCKET,endpoint_url=$CACHE_ENDPOINT,use_path_style=true,name=$CACHE_NAME,mode=max" \
          --output "type=image,\"name=$REGISTRY/$IMAGE_REPO:$IMAGE_TAG,$REGISTRY/$IMAGE_REPO:latest\",push=true" \
          --progress plain
      - echo "pushed $REGISTRY/$IMAGE_REPO:$IMAGE_TAG and :latest"
  digest:
    image: alpine:3.20
    depends_on: [push]
    # The SAME ClusterIP pin the push step needs. Learned the hard way on the
    # first run (pipeline 28): push succeeded, then this step spent 135s failing
    # to reach registry.ops.ciphera.net and exited 1. A pod dialling its own
    # cluster's public NLB hits the Exoscale hairpin — any step that talks to the
    # registry needs this, not just the one that pushes.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache curl >/dev/null
      - |
        TAG="sha-${CI_COMMIT_SHA:0:7}"
        DIGEST=$(curl -fsS -I -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          -H "Accept: application/vnd.oci.image.manifest.v1+json" \
          -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
          "https://registry.ops.ciphera.net/v2/ciphera-net/tessera-sidecar/manifests/$TAG" \
          | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "digest resolution failed for $TAG (got [$DIGEST])"; exit 1 ;;
        esac
        echo ""
        echo "tessera-sidecar $TAG -> $DIGEST"
        echo "Pin it in Infra/Kubernetes/workloads/id-backend/id-backend.yaml:"
        echo "  image: registry.ops.ciphera.net/ciphera-net/tessera-sidecar@$DIGEST"
