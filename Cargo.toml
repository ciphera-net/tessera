[package]
name = "ciphera-tessera"
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Tessera — open-source zero-knowledge identity (OPAQUE) core and sidecar"
repository = "https://github.com/ciphera-net/tessera"
homepage = "https://ciphera.net/products/tessera"
documentation = "https://docs.rs/ciphera-tessera"
# * crates.io renders keywords/categories from the manifest of a published
# * version — they cannot be edited on an existing release, so anything missing
# * here stays missing until the next publish. Max 5 keywords, and every
# * category must be an existing crates.io slug or the publish is rejected;
# * both below were checked against /api/v1/categories.
keywords = ["opaque", "pake", "authentication", "cryptography", "zero-knowledge"]
categories = ["cryptography", "authentication"]

[lib]
name = "tessera"
path = "src/lib.rs"

[[bin]]
name = "tessera-sidecar"
path = "src/bin/tessera-sidecar.rs"

[dependencies]
opaque-ke = { version = "4.0.1", features = ["ristretto255", "argon2", "serde"] }
sha2 = "=0.10.9"
rand = "=0.8.6"  # pinned: opaque-ke 4.x binds rand_core 0.6 (= rand 0.8); rand 0.9 would break its RngCore/CryptoRng bounds
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
base64 = "=0.22.1"
# Sealed login state (src/login_state.rs). XChaCha20-Poly1305 for its 192-bit
# nonce: a stateless sealer cannot keep a counter, so random nonces must be safe.
chacha20poly1305 = "=0.10.1"
# HKDF-SHA512 derives the sealing key from the ServerSetup, so no second secret
# has to be distributed to every replica or rotated in lockstep with the first.
hkdf = "=0.12.4"
thiserror = "=1.0.69"
zeroize = "=1.8.2"  # zero intermediate export_key/session_key copies (opaque-ke FinishResult is not ZeroizeOnDrop)

[dev-dependencies]
tempfile = "3"
